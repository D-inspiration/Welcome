<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Page not found — Atrivix</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<meta name="robots" content="noindex">
<style>
  :root {
    --bg: #0a0c10; --accent: #00d4aa; --accent-hover: #00b894;
    --text: #e8eaed; --text-2: #9aa0a6; --border: #2a2f3a;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: var(--bg); color: var(--text); min-height: 100vh;
    display: flex; align-items: center; justify-content: center; text-align: center; padding: 2rem;
  }
  .wrap { max-width: 420px; }
  .code { font-size: 3rem; font-weight: 800; color: var(--accent); margin-bottom: 0.5rem; }
  h1 { font-size: 1.3rem; margin-bottom: 0.8rem; }
  p { color: var(--text-2); margin-bottom: 1.8rem; font-size: 0.95rem; }
  .btn {
    display: inline-flex; align-items: center; gap: 0.4rem;
    padding: 0.6rem 1.4rem; border-radius: 8px; font-weight: 600; font-size: 0.9rem;
    border: none; cursor: pointer; text-decoration: none; background: var(--accent); color: #000;
  }
  .btn:hover { background: var(--accent-hover); }
</style>
</head>
<body>
  <div class="wrap">
    <div class="code">404</div>
    <h1>This page doesn't exist</h1>
    <p>The link might be broken, or the page may have moved.</p>
    <a href="/" class="btn">Back to Atrivix →</a>
  </div>
</body>
</html>
